const charAliases = {
  "gravekeeper":    "grave keeper",
  "ripper":         "the ripper",
  "feaster":        "the feaster",
  "breaking wheel": "the breaking wheel",
  "wheel":          "the breaking wheel",

};

function getCharImage(name) {
  const n = name.toLowerCase().trim();
  return charMap[charAliases[n] || n] || null;
}

function prettyChar(name) {
  const n = name.toLowerCase().trim();
  return (charAliases[n] || n).replace(/\b\w/g, c => c.toUpperCase());
}

const ASSET_BUST = `?t=${Date.now()}`;

function getLogoPath(name) {
  if (!name) return null;
  return "Teams/Logos/" + name + ".png";
}

let TEAMS = [];

const TEAM_FILES = [
  'BEE.json', 'BINGUS.json', 'Blood_Angels.json', 'CPTSD.json',
  'Fat_Chuds.json', 'FIORE.json', 'First_Love.json', 'Golden_Graves.json',
  'GoLoko.json', 'GSL.json', 'Heaven.json', 'Hot_Mess_Express.json',
  'HunnyBunny.json', 'Luminescence.json', 'Orion_Vortex.json', 'Rebel.json',
  'Rebellion.json', 'Rui_Potato.json', 'Sagittarius.json', 'Sigil.json',
  'Soft_Boiled.json', 'Team_Potential.json', 'The_Family.json', 'Tsunami.json'
];

async function loadTeams() {
  const bust = `?t=${Date.now()}`;
  const results = await Promise.all(
    TEAM_FILES.map(f =>
      fetch(`Teams/${f}${bust}`)
        .then(r => r.ok ? r.json() : null)
        .catch(() => null)
    )
  );
  return results.filter(Boolean);
}

function findTeam(name) {
  if (!name) return null;
  return TEAMS.find(t => t.Name.toLowerCase() === name.toLowerCase()) || null;
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function padCampList(list, target) {
  if (!list.length) return [];
  const out = shuffle(list);
  while (out.length < target) {
    const next = shuffle(list);
    if (next.length > 1 && next[0] === out[out.length - 1]) {
      [next[0], next[1]] = [next[1], next[0]];
    }
    for (const m of next) {
      if (out.length >= target) break;
      out.push(m);
    }
  }
  return out;
}

function buildCampPairs(list1, list2, camp) {
  if (!list1.length || !list2.length) return [];
  const n = Math.max(list1.length, list2.length);
  const a = padCampList(list1, n);
  const b = padCampList(list2, n);
  const pairs = [];
  for (let i = 0; i < n; i++) pairs.push({ camp, p1: a[i], p2: b[i] });
  return pairs;
}

function buildRound(t1, t2) {
  const sur = buildCampPairs(t1.SurMemberList || [], t2.SurMemberList || [], "sur");
  const hun = buildCampPairs(t1.HunMemberList || [], t2.HunMemberList || [], "hun");
  return shuffle([...sur, ...hun]);
}

const charIndex = new Map();
function pickChar(player) {
  const chars = player.Characters || [];
  if (!chars.length) return null;
  const key = player.Name;
  let i = charIndex.get(key);
  if (i === undefined) i = Math.floor(Math.random() * chars.length);
  else i = (i + 1) % chars.length;
  charIndex.set(key, i);
  return chars[i];
}

loadTeams().then(loaded => {
  TEAMS = loaded;

  const INTERVAL = 17700;
  const POLL_INTERVAL = 1500;

  const scene = document.querySelector(".scene");
  const navy  = document.querySelector(".navy-band");
  const leftSide   = document.getElementById("left-side");
  const rightSide  = document.getElementById("right-side");
  const leftImg    = document.getElementById("left-img");
  const rightImg   = document.getElementById("right-img");
  const leftStage  = leftSide.querySelector(".char-stage");
  const rightStage = rightSide.querySelector(".char-stage");
  const leftPlayer = document.getElementById("left-player");
  const rightPlayer= document.getElementById("right-player");
  const cycleTimerEl = document.getElementById("cycle-timer");

  cycleTimerEl.style.setProperty("--cycle-duration", (INTERVAL / 1000) + "s");

  function restartTimer() {
    cycleTimerEl.classList.remove("run");
    void cycleTimerEl.offsetWidth;
    cycleTimerEl.classList.add("run");
  }
  function stopTimer() {
    cycleTimerEl.classList.remove("run");
  }

  let team1 = null, team2 = null;
  let currentKey = "";
  let round = [];
  let idx = 0;
  let cycleTimer = null;

  function setVisible(on) {
    scene.style.visibility = on ? "" : "hidden";
    navy.style.visibility  = on ? "" : "hidden";
    cycleTimerEl.style.visibility = on ? "" : "hidden";
  }
  setVisible(false);

  function setLogo(wrap, path) {
    wrap.innerHTML = "";
    if (!path) return;
    const inner = document.createElement("div");
    inner.className = "logo-wrap";
    const img = document.createElement("img");
    img.className = "logo-img";
    img.onerror = () => { wrap.innerHTML = ""; };
    img.src = path;
    inner.appendChild(img);
    wrap.appendChild(inner);
  }

  function applyPair(pair) {
    const c1 = pickChar(pair.p1);
    const c2 = pickChar(pair.p2);
    const img1 = getCharImage(c1);
    const img2 = getCharImage(c2);

    leftSide.classList.remove("sur", "hun");
    rightSide.classList.remove("sur", "hun");
    leftSide.classList.add(pair.camp);
    rightSide.classList.add(pair.camp);

    leftPlayer.textContent  = pair.p1.Name;
    rightPlayer.textContent = pair.p2.Name;

    if (img1) leftImg.src  = img1;
    if (img2) rightImg.src = img2;
  }

  function next() {
    leftStage.classList.add("slid-out");
    rightStage.classList.add("slid-out");
    leftPlayer.classList.add("fade");
    rightPlayer.classList.add("fade");
    setTimeout(() => {
      idx++;
      if (idx >= round.length) {
        round = buildRound(team1, team2);
        idx = 0;
      }
      if (round.length) applyPair(round[idx]);
      leftStage.classList.remove("slid-out");
      rightStage.classList.remove("slid-out");
      leftPlayer.classList.remove("fade");
      rightPlayer.classList.remove("fade");
    }, 550);
    restartTimer();
  }

  function applyTeams(t1, t2) {
    team1 = t1;
    team2 = t2;

    document.getElementById("c-name1").textContent = t1.Name;
    document.getElementById("c-name2").textContent = t2.Name;
    setLogo(document.getElementById("logo1-wrap"), getLogoPath(t1.Name));
    setLogo(document.getElementById("logo2-wrap"), getLogoPath(t2.Name));

    round = buildRound(t1, t2);
    idx = 0;
    if (round.length) applyPair(round[0]);
    else leftPlayer.textContent = "No matching camp";

    if (cycleTimer) clearInterval(cycleTimer);
    if (round.length) cycleTimer = setInterval(next, INTERVAL);

    setVisible(true);
    if (round.length) restartTimer(); else stopTimer();
  }

  function clearTeams() {
    if (cycleTimer) { clearInterval(cycleTimer); cycleTimer = null; }
    team1 = team2 = null;
    round = [];
    setVisible(false);
    stopTimer();
  }

  async function pollState() {
    try {
      const r = await fetch("/state", { cache: "no-store" });
      if (!r.ok) return;
      const s = await r.json();
      const key = (s.team1 || "") + "\0" + (s.team2 || "");
      if (key === currentKey) return;
      currentKey = key;
      const t1 = findTeam(s.team1);
      const t2 = findTeam(s.team2);
      if (t1 && t2) applyTeams(t1, t2);
      else clearTeams();
    } catch {}
  }

  pollState();
  setInterval(pollState, POLL_INTERVAL);
});
</script>
</body>
</html>
